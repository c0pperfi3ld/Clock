<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clock Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    html, body { background:transparent; overflow:hidden; font-family:'Inter',system-ui,sans-serif; }
    #panel {
      width:100%; height:100vh; background:rgba(10,10,18,0.95);
      backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.08);
      border-radius:14px; display:flex; flex-direction:column; overflow:hidden;
      box-shadow:0 16px 48px rgba(0,0,0,0.8);
    }
    /* ── Title Bar ── */
    #titlebar {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 14px; -webkit-app-region:drag;
      background:rgba(255,255,255,0.03); border-bottom:1px solid rgba(255,255,255,0.06);
    }
    #titlebar span { font-size:0.72rem; font-weight:700; color:rgba(255,255,255,0.7); letter-spacing:0.06em; text-transform:uppercase; }
    .tb-btn { -webkit-app-region:no-drag; background:none; border:none; color:rgba(255,255,255,0.4);
      cursor:pointer; font-size:0.85rem; padding:2px 6px; border-radius:4px; transition:all 0.15s; }
    .tb-btn:hover { background:rgba(255,255,255,0.1); color:#fff; }
    .tb-btn.quit:hover { background:rgba(239,68,68,0.25); color:#ef4444; }

    /* ── Scrollable Body ── */
    #body {
      flex:1; overflow-y:auto; padding:6px 0 12px 0;
      scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.15) transparent;
    }
    #body::-webkit-scrollbar { width:4px; }
    #body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }

    /* ── Section Header ── */
    .sec-label {
      padding:8px 12px 4px; font-size:0.62rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.1em; color:#a78bfa; display:flex; align-items:center; justify-content:space-between;
    }
    .badge {
      background:rgba(167,139,250,0.15); color:#c4b5fd; font-size:0.55rem;
      padding:1px 6px; border-radius:10px; font-weight:600;
    }
    .sep { height:1px; background:rgba(255,255,255,0.06); margin:6px 0; }

    /* ── Option Items ── */
    .opt {
      display:flex; align-items:center; gap:8px; padding:5px 12px; cursor:pointer;
      transition:all 0.12s ease; font-size:0.73rem; color:rgba(255,255,255,0.7);
    }
    .opt:hover { background:rgba(255,255,255,0.07); color:#fff; }
    .opt.active { color:#a78bfa; font-weight:600; background:rgba(167,139,250,0.1); }
    .opt .dot {
      width:6px; height:6px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.25);
      flex-shrink:0; transition:all 0.15s;
    }
    .opt.active .dot { background:#a78bfa; border-color:#a78bfa; box-shadow:0 0 8px rgba(167,139,250,0.6); }

    /* ── Slider Row ── */
    .slider-row {
      display:flex; align-items:center; gap:8px; padding:6px 12px;
    }
    .slider-row label { font-size:0.68rem; color:rgba(255,255,255,0.5); min-width:48px; }
    .slider-row input[type="range"] {
      flex:1; height:3px; -webkit-appearance:none; background:rgba(255,255,255,0.12);
      border-radius:2px; outline:none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
      background:#a78bfa; cursor:pointer; border:none; box-shadow:0 0 6px rgba(167,139,250,0.5);
    }
    .slider-row .val { font-size:0.65rem; color:rgba(255,255,255,0.45); min-width:28px; text-align:right; }

    /* ── Checkbox Row ── */
    .chk-row {
      display:flex; align-items:center; gap:8px; padding:6px 12px; cursor:pointer;
      font-size:0.73rem; color:rgba(255,255,255,0.7); transition:background 0.12s;
    }
    .chk-row:hover { background:rgba(255,255,255,0.07); }
    .chk-row input { accent-color:#a78bfa; }
  </style>
</head>
<body>
  <div id="panel">
    <div id="titlebar">
      <span>⚙ Settings</span>
      <div>
        <button class="tb-btn quit" id="btn-quit" title="Quit App">✕ Quit</button>
        <button class="tb-btn" id="btn-close" title="Close Panel">✕</button>
      </div>
    </div>
    <div id="body"></div>
  </div>
  <script>
    const api = window.panelAPI;
    const body = document.getElementById('body');

    let current = { style:'classic', theme:'midnight', handType:'tapered', opacity:100 };

    api.onUpdateState(s => { Object.assign(current, s); render(); });

    const DESIGNS = {
      'GHOST & FLOATING (13)': [
        ['handsonly_ghost','👻 Pure Ghost'],
        ['ghost_mist','🌫️ Ghost Mist'],
        ['ghost_prism','🌈 Ghost Prism'],
        ['ghost_wireframe','🕸️ Ghost Wireframe'],
        ['ghost_shadow','👤 Ghost Shadow'],
        ['ghost_ember','🔥 Ghost Ember'],
        ['ghost_glass','🧊 Ghost Glass'],
        ['ghost_starlight','🌟 Ghost Starlight'],
        ['ghost_pulsar','💫 Ghost Pulsar'],
        ['ghost_cyberpunk','⚡ Ghost Cyberpunk'],
        ['ghost_zenith','☁️ Ghost Zenith'],
        ['handsonly_dark','🖤 Dark Minimal'],
        ['handsonly_glow','✨ Neon Glow']
      ],
      'WITH DIAL (25)': [
        ['classic','🕰️ Modern Classic'],['minimal','◯ Minimalist'],['roman','Ⅻ Roman Luxury'],
        ['neon','💡 Cyber Neon'],['skeleton','🔲 Skeleton Precision'],['chrono','⏱️ Luxury Chrono'],
        ['bauhaus','📐 Bauhaus Minimal'],['swiss','🇨🇭 Swiss Railway'],['pilot','✈️ Pilot Aviation'],
        ['diver','🤿 Diver Bold'],['artdeco','🎭 Art Deco'],['sundial','☀️ Sundial Bronze'],
        ['dashboard','🏎️ Dashboard Gauge'],['dotmatrix','💠 Dot Matrix LED'],['floatingnum','🔢 Floating Numerals'],
        ['astronomy','🌌 Celestial Galaxy'],['submariner','⚓ Submariner Tactical'],['industrial','⚙️ Industrial Steel'],
        ['papercraft','📄 Origami Paper'],['retrodigital','📟 Retro LCD'],['zen','☯️ Zen Garden'],
        ['hologram','💠 Quantum Hologram'],['copper','🪙 Antique Copper'],['monochrome','🔳 High Contrast Mono'],
        ['regatta','⛵ Regatta Racing']
      ],
      'UNIQUE MOTION (14)': [
        ['orbit','🪐 Orbital Planetoids'],['concentric','🎯 Concentric Arcs'],['radar','📡 Radar Sweep'],
        ['gradientarc','🌈 Gradient Arcs'],['hourglass','⏳ Digital Hourglass'],['sonar','🐬 Sonar Pulse'],
        ['sine','〰️ Sine Oscillation'],['dna','🧬 DNA Helix'],['pendulum','⏱️ Kinetic Pendulum'],
        ['compass','🧭 Magnetic Compass'],['eclipse_motion','🌒 Solar Eclipse'],['matrix_rain','🟢 Matrix Rain'],
        ['equalizer','📊 Audio Equalizer'],['vortex','🌀 Cosmic Vortex']
      ]
    };

    const HANDS = [
      ['tapered','Tapered Lancet'],['sword','Sword / Breguet'],['dauphine','Dauphine Diamond'],
      ['leaf','Leaf / Feuille'],['baton','Baton Straight'],['skeletonH','Skeleton Hollow'],
      ['arrow','Arrow'],['spade','Spade'],['cathedral','Gothic Cathedral'],['needle_minimal','Ultra Needle']
    ];

    const THEMES = [
      ['midnight','🟣 Midnight'],['obsidian','🟢 Obsidian'],['charcoal','🔵 Charcoal'],
      ['slate','🟡 Slate'],['eclipse','🔴 Eclipse'],['void','🩷 Void'],
      ['graphite','🩵 Graphite'],['onyx','🟠 Onyx'],['shadow','💜 Shadow'],['abyss','🔹 Abyss']
    ];

    function render() {
      let html = '';

      // Designs by Category
      for (const [group, items] of Object.entries(DESIGNS)) {
        html += `<div class="sec-label"><span>${group}</span><span class="badge">${items.length}</span></div>`;
        items.forEach(([id, label]) => {
          html += `<div class="opt${current.style===id?' active':''}" data-action="style" data-val="${id}">
            <div class="dot"></div>${label}</div>`;
        });
      }

      html += '<div class="sep"></div><div class="sec-label"><span>Hand Style</span><span class="badge">10</span></div>';
      HANDS.forEach(([id, label]) => {
        html += `<div class="opt${current.handType===id?' active':''}" data-action="hands" data-val="${id}">
          <div class="dot"></div>${label}</div>`;
      });

      html += '<div class="sep"></div><div class="sec-label"><span>Color Theme</span><span class="badge">10</span></div>';
      THEMES.forEach(([id, label]) => {
        html += `<div class="opt${current.theme===id?' active':''}" data-action="theme" data-val="${id}">
          <div class="dot"></div>${label}</div>`;
      });

      html += '<div class="sep"></div>';
      html += `<div class="slider-row"><label>Opacity</label>
        <input type="range" min="20" max="100" step="5" value="${current.opacity}" id="sl-opacity">
        <span class="val" id="val-opacity">${current.opacity}%</span></div>`;

      html += `<div class="chk-row" id="chk-ontop"><input type="checkbox" checked> Always on Top</div>`;

      body.innerHTML = html;

      // Bind click handlers
      body.querySelectorAll('.opt').forEach(el => {
        el.addEventListener('click', () => {
          const action = el.dataset.action;
          const val = el.dataset.val;
          if (action === 'style') { current.style = val; api.setStyle(val); }
          else if (action === 'hands') { current.handType = val; api.setHands(val); }
          else if (action === 'theme') { current.theme = val; api.setTheme(val); }
          render(); // Re-render to update active indicators
        });
      });

      document.getElementById('sl-opacity').addEventListener('input', e => {
        current.opacity = parseInt(e.target.value);
        document.getElementById('val-opacity').textContent = current.opacity + '%';
        api.setOpacity(current.opacity);
      });

      document.getElementById('chk-ontop').addEventListener('click', e => {
        const cb = e.currentTarget.querySelector('input');
        if (e.target !== cb) cb.checked = !cb.checked;
        api.setOnTop(cb.checked);
      });
    }

    document.getElementById('btn-close').addEventListener('click', () => api.closePanel());
    document.getElementById('btn-quit').addEventListener('click', () => api.closeApp());

    render();
  </script>
</body>
</html>
