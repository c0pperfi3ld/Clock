<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="app">
    <div id="clock-wrapper">
      <canvas id="clock"></canvas>
      <label id="picker-wrap-start" class="floating-picker" title="Remaining Color">

  </div>
  <script src="renderer.js"></script>
</body>
</html>
