<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="app">
    <!-- Window-edge resize handles -->
    <div class="app-resize-n" id="app-resize-n" title="Resize window"></div>
    <div class="app-resize-s" id="app-resize-s" title="Resize window"></div>
    <div class="app-resize-w" id="app-resize-w" title="Resize window"></div>
    <div class="app-resize-e" id="app-resize-e" title="Resize window"></div>
    <div class="app-resize-nw" id="app-resize-nw" title="Resize window"></div>
    <div class="app-resize-ne" id="app-resize-ne" title="Resize window"></div>
    <div class="app-resize-sw" id="app-resize-sw" title="Resize window"></div>
    <div class="app-resize-se" id="app-resize-se" title="Resize window"></div>
    <div id="clock-wrapper">
      <canvas id="clock"></canvas>
      <div id="link-toast" class="link-toast"></div>
      <label id="picker-wrap-start" class="floating-picker" title="Remaining Color">
         <input type="color" id="color-start">
      <label id="picker-wrap-end" class="floating-picker" title="Elapsed Color">
         <input type="color" id="color-end">
      </label>
    </div>
    <aside id="todo-panel">
      <div class="todo-resize-w" id="todo-resize-w" title="Resize todo list"></div>
      <div class="todo-resize-e" id="todo-resize-e" title="Resize todo list"></div>
      <div class="todo-tab-bar">
        <div class="todo-tabs" id="todo-tabs"></div>
        <button class="todo-tab-add" id="todo-tab-add" title="New list">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="todo-cal-toggle" id="todo-cal-toggle" title="Calendar">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="4.5" width="18" height="16" rx="2.5"></rect>
            <line x1="3" y1="9.5" x2="21" y2="9.5"></line>
            <line x1="8" y1="2.5" x2="8" y2="6.5"></line>
            <line x1="16" y1="2.5" x2="16" y2="6.5"></line>
          </svg>
        </button>
        <button class="todo-close-btn" id="todo-close-btn" title="Close App">×</button>
      </div>
      <div class="todo-cal-wrap" id="todo-cal-wrap">
        <div class="todo-cal-head">
          <button class="todo-cal-nav" id="todo-cal-prev" title="Previous month">‹</button>
          <div class="todo-cal-title" id="todo-cal-title"></div>
          <button class="todo-cal-nav" id="todo-cal-next" title="Next month">›</button>
          <button class="todo-cal-today" id="todo-cal-today" title="Go to today">Today</button>
        </div>
        <div class="todo-cal-grid" id="todo-cal-grid"></div>
        <div class="todo-cal-foot" id="todo-cal-foot"></div>
      </div>
      <div class="todo-link-bar" id="todo-link-bar" hidden>
        <span id="todo-link-text"></span>
        <button id="todo-link-cancel" title="Done linking">×</button>
      </div>
      <div class="todo-add-zone">
        <button class="todo-add-plus" id="todo-add-plus" title="Add task">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <div class="todo-add-box" id="todo-add-box" contenteditable="true" spellcheck="false" data-placeholder="Add a task…"></div>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
    </aside>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
