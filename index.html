<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="app">
    <div id="clock-wrapper">
      <canvas id="clock"></canvas>
      <label id="picker-wrap-start" class="floating-picker" title="Remaining Color">
         <input type="color" id="color-start">
      </label>
      <label id="picker-wrap-end" class="floating-picker" title="Elapsed Color">
         <input type="color" id="color-end">
      </label>
    </div>
    <aside id="todo-panel">
      <div class="todo-add-zone">
        <button class="todo-add-plus" id="todo-add-plus" title="Add task">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <div class="todo-add-box" id="todo-add-box" contenteditable="true" spellcheck="false" data-placeholder="Add a task…"></div>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
    </aside>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
